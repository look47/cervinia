<!DOCTYPE html>
<html lang="it">
<head>
    <title>Prenota - Rododendro Ski-In Ski-Out | Cervinia</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Prenota il tuo soggiorno a Cervinia. Appartamento ski-in ski-out sulla Pista 16 con garage privato e 6 posti letto.">
    <meta name="keywords" content="Cervinia, prenotazione, ski-in ski-out, Pista 16, appartamento vacanze">
    <meta property="og:title" content="Prenota - Rododendro Ski-In Ski-Out">
    <meta property="og:description" content="Prenota il tuo soggiorno a Cervinia. Appartamento ski-in ski-out sulla Pista 16.">
    <meta property="og:image" content="https://cervinia-ski-house.vercel.app/foto1.webp">
    <meta property="og:url" content="https://cervinia-ski-house.vercel.app/recap.html">
    <meta property="og:type" content="website">
    <link rel="canonical" href="https://cervinia-ski-house.vercel.app/recap.html">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="main-nav">
    <div class="nav-container">
        <a href="index.html" class="nav-logo">
            <span class="nav-logo-main">RODODENDRO</span>
            <span class="nav-logo-sub">Cervinia Ski Home</span>
        </a>
        <div class="nav-menu">
            <a href="index.html" class="nav-link">Home</a>
            <a href="recap.html" class="nav-link active nav-cta">Prenota</a>
        </div>
        <div class="nav-lang">
            <span id="lang-it" onclick="setLanguage('it')">🇮🇹</span>
            <span id="lang-en" onclick="setLanguage('en')">🇬🇧</span>
        </div>
    </div>
</nav>

<div class="main-wrapper">
    <div class="container" style="max-width:1000px;">
        
        <div class="material-card" style="margin-top: 30px;">
            <!-- LOGO IN FILIGRANA (Sfondo della box) -->
            <img src="sfondo_nero.webp" class="card-bg-logo">

            <h1 style="text-align:center; color:var(--accent); margin-bottom:30px; font-weight:800; position:relative; z-index:1;">RESERVATION</h1>
            
            <div class="recap-main-grid">
                <!-- SINISTRA: CALENDARIO -->
                <div class="cal-section">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <button onclick="shiftMonth(-1)" style="background:none; border:none; color:var(--accent); cursor:pointer; font-size:20px; padding:5px;">❮</button>
                        <button onclick="shiftMonth(1)" style="background:none; border:none; color:var(--accent); cursor:pointer; font-size:20px; padding:5px;">❯</button>
                    </div>
                    <!-- Il calendario viene iniettato qui dallo script -->
                    <div id="calendar-render" style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;"></div>
                    
                    <!-- LEGENDA -->
                    <div style="margin-top:20px; display:flex; gap:15px; flex-wrap:wrap; font-size:11px; opacity:0.8;">
                        <div style="display:flex; align-items:center; gap:6px;">
                            <div style="width:12px; height:12px; background:#27ae60; border-radius:3px;"></div>
                            <span class="lang-txt" data-it="Disponibile" data-en="Available">Disponibile</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:6px;">
                            <div style="width:12px; height:12px; background:#c0392b; border-radius:3px; opacity:0.4;"></div>
                            <span class="lang-txt" data-it="Occupato" data-en="Booked">Occupato</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:6px;">
                            <div style="width:12px; height:12px; background:var(--accent); border-radius:3px;"></div>
                            <span class="lang-txt" data-it="Selezionato" data-en="Selected">Selezionato</span>
                        </div>
                    </div>
                </div>

                <!-- DESTRA: OSPITI -->
                <aside>
                    <div class="skier-ctrl">
                        <i class="fas fa-skier" style="color:var(--accent); font-size:24px;"></i>
                        <div style="font-size:10px; margin:5px 0; font-weight:800;">ADULTI</div>
                        <div style="display:flex; justify-content:center; align-items:center; gap:15px;">
                            <button onclick="setGuests('ad', -1)" style="background:none; border:none; color:white; cursor:pointer; font-size:18px;">-</button>
                            <b id="valAd" style="font-size:20px;">2</b>
                            <button onclick="setGuests('ad', 1)" style="background:none; border:none; color:white; cursor:pointer; font-size:18px;">+</button>
                        </div>
                    </div>
                    <div class="skier-ctrl">
                        <i class="fas fa-skier" style="color:var(--accent); font-size:18px;"></i>
                        <div style="font-size:10px; margin:5px 0; font-weight:800;">BAMBINI</div>
                        <div style="display:flex; justify-content:center; align-items:center; gap:15px;">
                            <button onclick="setGuests('ch', -1)" style="background:none; border:none; color:white; cursor:pointer; font-size:18px;">-</button>
                            <b id="valCh" style="font-size:20px;">0</b>
                            <button onclick="setGuests('ch', 1)" style="background:none; border:none; color:white; cursor:pointer; font-size:18px;">+</button>
                        </div>
                    </div>
                    <div style="font-size:10px; text-align:center; opacity:0.5; margin-top:10px;">Max 6 ospiti totali</div>
                </aside>
            </div>

            <!-- DATI OSPITE -->
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-top:30px; position:relative; z-index:1;">
                <input type="text" id="fName" class="input-f-recap" placeholder="Nome" required>
                <input type="text" id="fSurname" class="input-f-recap" placeholder="Cognome" required>
                <input type="email" id="fEmail" class="input-f-recap" placeholder="Email" required>
                <input type="tel" id="fPhone" class="input-f-recap" placeholder="Telefono" required>
            </div>

            <!-- PREZZO E TASTO INVIO -->
            <div style="text-align:center; margin-top:30px; border-top:1px solid rgba(255,255,255,0.1); padding-top:20px; position:relative; z-index:1;">
                <div id="oldPrice" style="text-decoration:line-through; opacity:0.4; font-size:18px;"></div>
                <div id="totalPrice" style="font-size:48px; color:var(--accent); font-weight:800;">...</div>
                <div style="font-size:14px; opacity:0.7;">Acconto richiesto (30%): <b id="depositTxt">0€</b></div>
                <button id="mainConfirmBtn" onclick="confirmBooking()" style="width:100%; background:var(--accent); color:black; border:none; padding:20px; border-radius:15px; font-weight:800; cursor:pointer; margin-top:20px; font-size:18px;">CONFERMA E PRENOTA</button>
            </div>
        </div>
    </div>
</div>

<!-- SCRIPTS -->
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
